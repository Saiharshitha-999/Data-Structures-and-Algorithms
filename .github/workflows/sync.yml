name: Sync DSA Portfolio

on:
  workflow_dispatch: # Lets you manually trigger the import for your 200+ old problems
  schedule:
    - cron: '0 8 * * *' # Automatically checks and pulls new solutions every day at 8 AM

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Code
        uses: joshcai/leetcode-sync@v1.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          
          # This organizes your folders strictly by Difficulty -> Topic/Category -> Problem Name
          destination-folder: '${{ leetcode.difficulty }}/${{ leetcode.category }}/${{ leetcode.title_slug }}'
